<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiherramientas.gt — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1f22;
    --steel:#2a2e33;
    --steel-2:#3a3f45;
    --concrete:#e9e7e1;
    --plate:#f4f3ef;
    --yellow:#ffc72c;
    --orange:#e8590c;
    --whatsapp:#25d366;
    --line:#c9c6bd;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--concrete);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.eyebrow,.chip,.btn-wa,.price{font-family:'Oswald',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  a{color:inherit;text-decoration:none;}

  /* ---------- HAZARD STRIPE ---------- */
  .hazard{
    height:10px;
    background:repeating-linear-gradient(135deg,var(--yellow) 0 18px,var(--ink) 18px 36px);
  }

  /* ---------- HEADER ---------- */
  header{
    background:radial-gradient(circle at 15% 20%, #34393f 0%, var(--ink) 60%);
    color:var(--plate);
    padding:52px 20px 40px;
    text-align:center;
    position:relative;
  }
  .brand-eyebrow{
    display:inline-block;
    font-size:0.72rem;
    letter-spacing:0.35em;
    color:var(--yellow);
    text-transform:uppercase;
    margin-bottom:14px;
    border:1px solid rgba(255,199,44,0.4);
    padding:4px 14px;
    border-radius:2px;
  }
  header h1{
    font-size:clamp(2.1rem, 6vw, 3.6rem);
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    margin:0 0 10px;
    line-height:1.05;
  }
  header p.tag{
    color:#c9cdd2;
    font-size:1rem;
    margin:0 0 28px;
    font-weight:400;
    letter-spacing:0.02em;
  }

  .search-wrap{
    max-width:560px;
    margin:0 auto;
    position:relative;
  }
  #buscador{
    width:100%;
    padding:15px 20px 15px 46px;
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
    background:#101214;
    border:1px solid #45494f;
    border-radius:3px;
    color:var(--plate);
    outline:none;
  }
  #buscador::placeholder{color:#7c8188;}
  #buscador:focus{border-color:var(--yellow);}
  .search-wrap::before{
    content:"";
    position:absolute;
    left:16px; top:50%;
    width:16px;height:16px;
    transform:translateY(-50%);
    background:#7c8188;
    -webkit-mask:radial-gradient(circle 6px at 6px 6px, transparent 5px, #000 5.5px) 0 0/12px 12px no-repeat,
                 linear-gradient(#000,#000) 8px 8px/2px 8px no-repeat;
    mask:radial-gradient(circle 6px at 6px 6px, transparent 5px, #000 5.5px) 0 0/12px 12px no-repeat,
         linear-gradient(#000,#000) 8px 8px/2px 8px no-repeat;
  }

  /* ---------- CATEGORY FILTER ---------- */
  .filters{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--steel);
    border-bottom:3px solid var(--yellow);
    padding:12px 16px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    background:transparent;
    color:#d7dade;
    border:1px solid #565b62;
    padding:8px 16px;
    border-radius:2px;
    font-size:0.78rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:500;
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .chip:hover{border-color:var(--yellow);}
  .chip.active{
    background:var(--yellow);
    color:var(--ink);
    border-color:var(--yellow);
    font-weight:600;
  }

  /* ---------- RESULTS META ---------- */
  .meta-bar{
    max-width:1240px;
    margin:22px auto 0;
    padding:0 20px;
    font-size:0.8rem;
    color:#6b6f66;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(272px, 1fr));
    gap:22px;
    max-width:1240px;
    margin:14px auto 60px;
    padding:0 20px;
  }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:#8a8d84;
    display:none;
  }

  /* ---------- CARD (spec plate) ---------- */
  .card{
    background:var(--plate);
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 24px rgba(0,0,0,0.16);
  }
  .card-head{
    background:var(--steel);
    color:var(--plate);
    padding:12px 16px 10px 30px;
    position:relative;
  }
  .rivet{
    position:absolute;
    width:7px;height:7px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #cfd3d6, #6b6f74 70%);
    top:9px;
  }
  .rivet.l{left:9px;}
  .card-code{
    font-size:0.66rem;
    color:var(--yellow);
    letter-spacing:0.12em;
    display:block;
    margin-bottom:2px;
  }
  .card-head h3{
    margin:0;
    font-size:0.98rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.02em;
    line-height:1.2;
  }
  .card-img{
    background:
      linear-gradient(180deg, transparent 0, transparent 100%),
      repeating-linear-gradient(45deg, #dedcd5 0 2px, #e6e4dd 2px 26px);
    height:168px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
    border-bottom:1px solid var(--line);
  }
  .card-img img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    mix-blend-mode:multiply;
  }
  .card-body{
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    flex:1;
  }
  .price-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .price{
    font-size:1.05rem;
    font-weight:700;
    color:var(--orange);
    background:#fdece1;
    padding:4px 10px;
    border-radius:2px;
    letter-spacing:0.02em;
  }
  .price.consultar{
    color:var(--steel-2);
    background:#e9e7e1;
    font-size:0.82rem;
  }
  .det{
    font-size:0.83rem;
    color:#54585d;
    line-height:1.45;
    margin:0 0 6px;
    flex:1;
  }
  .rec{
    font-size:0.68rem;
    color:#8a8d84;
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin:0 0 12px;
  }
  .btn-wa{
    background:var(--whatsapp);
    color:#fff;
    border:none;
    padding:11px;
    width:100%;
    border-radius:2px;
    cursor:pointer;
    font-size:0.82rem;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .15s;
  }
  .btn-wa:hover{background:#1fb457;}
  .btn-wa svg{width:15px;height:15px;flex:0 0 auto;}

  /* ---------- FLOATING WA ---------- */
  .fab{
    position:fixed;
    bottom:22px; right:22px;
    width:56px;height:56px;
    background:var(--whatsapp);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
    z-index:30;
    animation:pulse 2.4s infinite;
  }
  .fab svg{width:26px;height:26px;fill:#fff;}
  @keyframes pulse{
    0%{box-shadow:0 6px 18px rgba(0,0,0,0.3), 0 0 0 0 rgba(37,211,102,0.5);}
    70%{box-shadow:0 6px 18px rgba(0,0,0,0.3), 0 0 0 14px rgba(37,211,102,0);}
    100%{box-shadow:0 6px 18px rgba(0,0,0,0.3), 0 0 0 0 rgba(37,211,102,0);}
  }
  @media (prefers-reduced-motion: reduce){
    .fab{animation:none;}
    .card{transition:none;}
  }

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--ink);
    color:#9ea1a6;
    text-align:center;
    padding:34px 20px;
    font-size:0.8rem;
    letter-spacing:0.03em;
  }
  footer strong{color:var(--plate);}

  @media (max-width:480px){
    .grid{grid-template-columns:1fr;}
    header{padding:40px 16px 32px;}
  }
</style>
</head>
<body>

<header>
  <span class="brand-eyebrow">Herramienta industrial · Guatemala</span>
  <h1>Multiherramientas.gt</h1>
  <p class="tag">Calidad, garantía y respaldo en cada compra.</p>

<script>
const productos = [

  {n:"Soldadora XCORT 300A", p:"Q3,600", img:"Soldadora xcort.png", det:"MIG/MAG/MMA, incluye accesorios.", cat:"soldadura"},
  {n:"Generador Inversor", p:"Q12,500", img:"Generador Inversor.png", det:"A-iPower, 2600W, tecnología inverter.", cat:"generadores"},
  {n:"Revolvedora 5 HP", p:"Q12,500", img:"Revolvedora de cemento.png", det:"Honda, capacidad 1 saco, remolcable.", cat:"construccion"},
  {n:"Desgranadora", p:"Q1,750", img:"Desgranador.png", det:"Tudor, motor eléctrico 1.5 HP.", cat:"agricola"},
  {n:"Fumigadora parihuela", p:null, img:"Fumigadora para parihuela.png", det:"100m manguera, ruedas de tracción.", cat:"agricola"},
  {n:"Molino nixtamal", p:null, img:"Molino para nixtamal.png", det:"Estructura reforzada, motor Cyclone 6.5HP.", cat:"agricola"},
  {n:"Rodillo compactador", p:null, img:"Rodo compactador.png", det:"Honda GX160, 60cm tambor.", cat:"construccion"},
  {n:"Hidrolavadora Honda", p:null, img:"Hidrolabadora honda.png", det:"3300 PSI, bomba industrial italiana.", cat:"hidrolavado"},
  {n:"Mezcladora 9HP", p:null, img:"Mezcladora 2 sacos.png", det:"Motor Honda 9HP, capacidad 2 sacos.", cat:"construccion"},
  {n:"Mezcladora 600L", p:"Q19,000", img:"Mezcladora 2 sacos 4 llantas.png", det:"Honda 15HP, remolcable, 4 llantas.", cat:"construccion"},
  {n:"Revolvedora 1 saco", p:"Q4,000", img:"Revolvedora 1 saco.png", det:"Rhino, motor Lifan 3HP, 200 litros.", cat:"construccion"},
  {n:"Hidrolavadora Rhino", p:"Q4,300", img:"Hidrolabadora rhino.png", det:"2000 PSI, incluye accesorios.", cat:"hidrolavado"},
  {n:"Vibradora concreto", p:"Q1,450", img:"Bibrador de concreto.png", det:"Rhino 1600W, chicote 4 metros.", cat:"construccion"},
  {n:"Juego copas impacto", p:"Q1,300", img:"Jugos de copas 1.png", det:"26 piezas, Rhino Tools.", cat:"electricas"},
  {n:"Pistola impacto Milwaukee", p:"Q5,800", img:"Pistola de impacto milwaukee.png", det:"1491 Nm torque, industrial.", cat:"electricas"},
  {n:"Llave impacto Milwaukee", p:null, img:"Llave de impacto milwaukee.png", det:"Incluye 2 baterías y estuche.", cat:"electricas"},
  {n:"Juego taladros XR", p:"Q3,000", img:"juego de taladros o kit marca Dewalt.png", det:"DeWalt 20V, 2 baterías, cargador.", cat:"electricas"},
  {n:"Sierra circular 7 1/4", p:"Q900", img:"sierra circular Dewalt.png", det:"1500 W, 5500 RPM, disco 7 1/4.", cat:"electricas"},
  {n:"Baterías y cargador", p:null, img:"bateria y cargador Dewalt 2,4 y 5 amperios cargador rapido para 2 y 4 amperios.png", det:"DeWalt, baterías 2/4/5 Ah, cargador.", cat:"electricas"},
  {n:"Rotomartillo demoledor", p:"Q1,300", img:"rotomartillo demoledor victeche.png", det:"Victeche 2400W, 65J, punta y cincel.", cat:"electricas"},
  {n:"Rotomartillo industrial", p:"Q700", img:"Rotomartillo emtop.png", det:"Emtop 1500W, 5.5J, SDS Plus.", cat:"electricas"},
  {n:"Sierra caladora", p:"Q550", img:"Sierra caladora.png", det:"Para cortes precisos en madera.", cat:"electricas"},
  {n:"Pulidora XR 4 1/2", p:"Q3,500", img:"Pulidora o esmeriladora Dewalt.png", det:"DeWalt, 2 baterías STACK 5Ah.", cat:"electricas"},
  {n:"Compresor 80G DeWalt", p:"Q14,000", img:"COMPRESOR DEWALT 80 GALONES.png", det:"Uso industrial, incluye llave impacto.", cat:"compresores"},
  {n:"Compresor dental", p:"Q2,600", img:"COMPRESOR USO DENTAL CAMPBELL HAUSFELD.png", det:"2HP, 80L, silencioso, sin aceite.", cat:"compresores"},

  {n:"Cepilladora Woodmaxx", p:"Q14,500", img:"Cepilladora WoodMaxx 15 pulgadas 3hp.png", det:"15 pulg, 3HP, 4 cuchillas.", cat:"carpinteria"},
  {n:"Canteadora 6 pulg", p:"Q5,950", img:"Canteadora Woodmaxx de 6.png", det:"Woodmaxx, motor 1HP, mesa 40 pulg.", cat:"carpinteria"},
  {n:"Trompo para madera", p:"Q10,500", img:"Trompo Para Madera Woodmax.png", det:"Woodmaxx 3HP, husillo 1/2, 3/4 y 1.", cat:"carpinteria"},

];

const categorias = [
  {id:"todos", label:"Todos"},
  {id:"compresores", label:"Compresores"},
  {id:"soldadura", label:"Soldadura"},
  {id:"carpinteria", label:"Carpintería"},
  {id:"construccion", label:"Construcción"},
  {id:"hidrolavado", label:"Hidrolavado"},
  {id:"electricas", label:"Herramienta eléctrica"},
  {id:"agricola", label:"Agrícola"},
  {id:"automotriz", label:"Automotriz"},
  {id:"generadores", label:"Generadores"}
];

const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(`
  <svg xmlns="http://www.w3.org/2000/svg" width="140" height="140">
    <rect width="140" height="140" fill="none"/>
    <g stroke="#9a9d94" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M40 100 L75 65"/>
      <circle cx="90" cy="50" r="18"/>
      <path d="M90 32 v10 M90 58 v10 M72 50 h10 M98 50 h10"/>
    </g>
  </svg>`);

const listaEl = document.getElementById('lista');
const filtrosEl = document.getElementById('filtros');
const metaBar = document.getElementById('metaBar');
const vacioEl = document.getElementById('vacio');
let catActiva = 'todos';

function renderFiltros(){
  filtrosEl.innerHTML = categorias.map(c =>
    `<button class="chip${c.id===catActiva?' active':''}" data-cat="${c.id}">${c.label}</button>`
  ).join('');
  filtrosEl.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      catActiva = btn.dataset.cat;
      renderFiltros();
      renderLista();
    });
  });
}

function renderLista(){
  const q = document.getElementById('buscador').value.trim().toLowerCase();
  const filtrados = productos.filter(prod=>{
    const enCat = catActiva === 'todos' || prod.cat === catActiva;
    const texto = (prod.n + ' ' + prod.det).toLowerCase();
    const enBusqueda = !q || texto.includes(q);
    return enCat && enBusqueda;
  });

  listaEl.innerHTML = filtrados.map((prod, i)=>{
    const codigo = 'MHG-' + String(productos.indexOf(prod)+1).padStart(3,'0');
    const precioHtml = prod.p
      ? `<span class="price mono">${prod.p}</span>`
      : `<span class="price consultar mono">Consultar</span>`;
    return `
      <div class="card">
        <div class="card-head">
          <span class="rivet l"></span>
          <span class="card-code mono">${codigo}</span>
          <h3>${prod.n}</h3>
        </div>
        <div class="card-img">
          <img src="${prod.img}" alt="${prod.n}" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER}';">
        </div>
        <div class="card-body">
          <div class="price-row">${precioHtml}</div>
          <p class="det">${prod.det}</p>
          <p class="rec">Pago contra entrega · garantía y factura</p>
          <a href="https://wa.me/50236389133?text=${encodeURIComponent('Hola, quiero información sobre: ' + prod.n)}" target="_blank" rel="noopener">
            <button class="btn-wa">
              <svg viewBox="0 0 32 32" fill="#fff"><path d="M16.001 3C9.373 3 4 8.373 4 15c0 2.386.7 4.61 1.902 6.478L4 29l7.706-1.87A11.94 11.94 0 0 0 16.001 27C22.629 27 28 21.627 28 15S22.629 3 16.001 3zm6.883 16.897c-.293.822-1.454 1.51-2.373 1.706-.63.132-1.454.238-4.226-.907-3.545-1.464-5.826-5.06-6.005-5.294-.172-.234-1.44-1.914-1.44-3.65 0-1.735.907-2.586 1.229-2.942.322-.356.702-.445.936-.445.234 0 .468.002.673.012.216.01.505-.082.79.603.293.703.994 2.437 1.081 2.615.088.178.147.386.03.62-.117.234-.176.379-.35.583-.176.203-.37.454-.528.61-.176.174-.36.362-.155.71.205.35.912 1.505 1.957 2.437 1.344 1.2 2.478 1.572 2.827 1.75.35.176.554.146.76-.088.205-.234.876-1.02 1.11-1.37.234-.35.468-.29.79-.174.322.117 2.05.966 2.4 1.142.35.176.585.264.673.41.088.146.088.847-.205 1.67z"/></svg>
              Consultar por WhatsApp
            </button>
          </a>
        </div>
      </div>`;
  }).join('');

  metaBar.textContent = `${filtrados.length} producto${filtrados.length===1?'':'s'}`;
  vacioEl.style.display = filtrados.length ? 'none' : 'block';
}

document.getElementById('buscador').addEventListener('input', renderLista);
renderFiltros();
renderLista();
</script>
</body>
</html>
